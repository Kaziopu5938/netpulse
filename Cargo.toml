[package]
name = "netpulse"
version = "1.1.2"
edition = "2021"
description = "Lightweight Windows taskbar internet speed meter"
license = "MIT"

[dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "system_fonts"] }
tray-icon = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.56"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
